.eb {
  min-height: 100vh;
  --display: 'Ausion', Georgia, serif;
  --text: 'Canto', Georgia, serif;
  --util: 'ABC Diatype', ui-sans-serif, system-ui, sans-serif;

  --ink: #1A1815;
  --ink-70: #55514A;
  --ink-45: #8B857A;
  --paper: #E4DFD3;
  --sheet: #FCFAF5;
  --hair: #D9D4C8;
  --hair-soft: #E8E3D8;
  --claret: #8A2B2B;
  --claret-soft: #F4E9E6;

  background: var(--paper);
  background-image: radial-gradient(ellipse at 50% 0%, #EFEBE1, var(--paper) 62%);
  color: var(--ink);
  font-family: var(--text);
  font-size: 16px;
  line-height: 1.55;
  padding: 0 0 44px;
  -webkit-font-smoothing: antialiased;
}
.eb * { box-sizing: border-box; }
.eb :where(button) { font: inherit; color: inherit; background: none; border: none; cursor: pointer; padding: 0; }
.eb button:focus-visible, .eb input:focus-visible { outline: 1.5px solid var(--claret); outline-offset: 2px; }

.sheet {
  max-width: 1060px; margin: 0 auto;
  background-color: var(--sheet);
  background-image:
    radial-gradient(circle at 18% 28%, rgba(26,24,21,.05) 0 1px, transparent 1.5px),
    radial-gradient(circle at 72% 66%, rgba(26,24,21,.035) 0 1px, transparent 1.5px),
    radial-gradient(circle at 46% 88%, rgba(26,24,21,.03) 0 1px, transparent 1.4px);
  background-size: 23px 23px, 31px 29px, 41px 37px;
  border-left: 1px solid var(--hair); border-right: 1px solid var(--hair); border-bottom: 4px solid var(--ink);
  box-shadow: 0 20px 44px -34px rgba(26, 24, 21, .5);
}

/* ---- masthead ---- */
.masthead { position: relative; padding: 26px 44px 24px; border-top: 3px solid var(--ink); border-bottom: 1px solid var(--ink); text-align: center; }
.masthead::before { content: ""; position: absolute; top: 3px; left: 0; right: 0; border-top: 1px solid var(--ink); }
.ornament { display: block; margin: 0 auto 12px; color: var(--ink); }
.seed-poppy { fill: var(--claret); }
.seed-ink { fill: var(--ink); opacity: .72; }
.folio { display: flex; align-items: center; justify-content: space-between; gap: 14px; margin: 0 0 16px; font-family: var(--util); font-size: 10px; letter-spacing: .16em; text-transform: uppercase; color: var(--ink-45); }
.folio-mid { color: var(--ink-70); }
.flag { text-align: right; min-width: 84px; }
.flag.error { color: var(--claret); }
.flag.preview { color: var(--claret); }
.masthead h1 { font-family: var(--display); font-weight: 400; font-size: clamp(38px, 8vw, 76px); line-height: .92; letter-spacing: -.005em; margin: 0; }

/* ---- resume notice ---- */
.resume { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; padding: 11px 44px; border-bottom: 1px solid var(--hair); background: var(--sheet); }
.resume p { flex: 1; min-width: 180px; margin: 0; font-size: 13px; font-weight: 300; color: var(--ink-70); }
.resume b { font-weight: 400; color: var(--ink); }
.resume button { font-family: var(--util); font-size: 9.5px; letter-spacing: .14em; text-transform: uppercase; color: var(--ink-45); border-bottom: 1px solid var(--hair); }
.resume button:hover { color: var(--claret); border-color: var(--claret); }
.resume .dismiss { font-family: inherit; font-size: 16px; letter-spacing: 0; border: none; color: var(--hair); }

/* ---- preview notice ---- */
.proof { display: flex; align-items: center; gap: 18px; flex-wrap: wrap; padding: 13px 44px; background: var(--claret-soft); border-bottom: 1px solid var(--ink); }
.proof p { flex: 1; min-width: 240px; margin: 0; font-size: 13px; font-weight: 300; line-height: 1.5; color: #6B2A2A; }
.proof b { font-family: var(--util); font-weight: 500; font-size: 10px; letter-spacing: .16em; text-transform: uppercase; color: var(--claret); margin-right: 6px; }
.proof button { padding: 7px 14px; font-family: var(--util); font-size: 9.5px; letter-spacing: .14em; text-transform: uppercase; color: var(--claret); border: 1px solid var(--claret); }
.proof button:hover { background: var(--claret); color: var(--claret-soft); }

/* ---- lede ---- */
.lede { padding: 38px 44px 38px; border-bottom: 1px solid var(--ink); background: linear-gradient(180deg, rgba(255,253,247,.9), rgba(252,250,245,0)); }
.kicker { font-family: var(--util); font-size: 10px; letter-spacing: .18em; text-transform: uppercase; color: var(--claret); margin: 0 0 16px; }
.kicker::before { content: ""; display: block; width: 46px; height: 2px; background: var(--claret); margin-bottom: 15px; }
.lede h2 { font-family: var(--display); font-weight: 400; font-size: clamp(34px, 6.4vw, 62px); line-height: 1.02; letter-spacing: -.01em; margin: 0; max-width: 15ch; }
.lede.quiet h2 { font-size: clamp(26px, 4vw, 38px); color: var(--ink-70); max-width: 22ch; }
.deck { font-size: 19px; font-weight: 300; color: var(--ink-70); margin: 14px 0 0; max-width: 34ch; }
.deck i { color: var(--ink); }
.lede-who { font-family: var(--util); font-size: 10.5px; letter-spacing: .08em; color: var(--ink-45); margin: 18px 0 0; }

/* ---- layout ---- */
.cols { display: grid; grid-template-columns: 1.32fr 1fr; }
.col { min-width: 0; }
.side { border-left: 1px solid var(--hair); background: rgba(176, 148, 96, .055); }
.block { padding: 30px 34px; border-bottom: 1px solid var(--hair-soft); }
.main .block { padding-left: 44px; }
.block:last-child { border-bottom: none; }

.rule-head { display: flex; align-items: center; gap: 12px; margin: 0 0 20px; font-family: var(--util); font-weight: 500; font-size: 10px; letter-spacing: .18em; text-transform: uppercase; color: var(--ink); }
.rule-head::after { content: ""; flex: 1; height: 1px; background: var(--ink); opacity: .22; }
.sub { font-family: var(--text); font-size: 17px; color: var(--ink-70); margin: 26px 0 12px; }
.note { font-size: 13.5px; font-weight: 300; line-height: 1.6; color: var(--ink-45); margin: 14px 0 0; }
.caption { font-size: 13px; font-weight: 300; line-height: 1.55; color: var(--ink-45); margin: 14px 0 0; padding-top: 10px; border-top: 1px solid var(--hair-soft); }
.caption i { font-family: var(--util); font-size: 9.5px; letter-spacing: .14em; text-transform: uppercase; color: var(--ink-70); }
.link { font-family: var(--util); font-size: 14px; font-weight: 400; letter-spacing: .005em; text-transform: none; color: var(--claret); margin-left: 12px; vertical-align: middle; text-decoration: underline; text-underline-offset: 2px; text-decoration-thickness: .7px; }
.link:hover { text-decoration-thickness: 1.2px; }

/* ---- family picker ---- */
.houses { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--hair-soft); }
.houses li { border-bottom: 1px solid var(--hair-soft); }
.houses button { display: flex; align-items: baseline; gap: 16px; width: 100%; padding: 16px 6px; text-align: left; }
.houses button { position: relative; transition: background .14s ease; }
.houses button:hover { background: #F7F3EA; box-shadow: inset 3px 0 0 var(--claret); }
.house-name { font-family: var(--display); font-size: 25px; }
.house-kids { font-size: 14px; font-weight: 300; color: var(--ink-45); }
.house-last { margin-left: auto; font-family: var(--util); font-size: 9px; letter-spacing: .14em; text-transform: uppercase; color: var(--claret); }
.house-last + .house-go { margin-left: 14px; }
.house-go { margin-left: auto; font-family: var(--util); font-size: 10px; letter-spacing: .16em; text-transform: uppercase; color: var(--ink-45); }
.houses button:hover .house-go { color: var(--claret); }

.myhouse { font-family: var(--display); font-size: 30px; line-height: 1.1; margin: 0; }

/* ---- availability ---- */
.avail { display: grid; grid-template-columns: 42px repeat(4, 1fr); gap: 1px; background: var(--hair); border: 1px solid var(--hair); }
.avail > * { background: var(--sheet); }
.avail-col { font-size: 13px; font-weight: 300; color: var(--ink-45); text-align: center; padding: 9px 4px; }
.avail-day { font-family: var(--util); font-size: 10px; letter-spacing: .12em; text-transform: uppercase; color: var(--ink-45); display: flex; align-items: center; justify-content: center; }
.avail .cell { height: 46px; border: none; background: var(--sheet); transition: background .14s ease; }
.avail .cell:hover { background: #F0EBDE; }
.avail .cell.on { background: var(--ink); }
.avail .cell.on:hover { background: #34302A; }

/* ---- activities ---- */
.acts { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--hair-soft); }
.acts li { display: flex; align-items: center; border-bottom: 1px solid var(--hair-soft); }
.act { flex: 1; display: flex; align-items: baseline; gap: 14px; padding: 14px 2px; text-align: left; min-width: 0; }
.tick { flex: 0 0 auto; width: 15px; height: 15px; border: 1px solid var(--ink-45); transform: translateY(2px); transition: background .14s ease, border-color .14s ease; }
.acts li.on .tick { background: var(--claret); border-color: var(--claret); box-shadow: inset 0 0 0 2.5px var(--sheet); }
.act-body { min-width: 0; }
.act-name { display: block; font-size: 17px; line-height: 1.25; }
.acts li.on .act-name { color: var(--claret); }
.act-meta { display: block; font-size: 12.5px; font-weight: 300; color: var(--ink-45); margin-top: 3px; }
.act-count { margin-left: auto; font-family: var(--display); font-size: 19px; line-height: 1; color: var(--ink-45); padding-left: 10px; }
.acts li.on .act-count { color: var(--claret); }
.drop { width: 26px; text-align: center; font-size: 16px; color: var(--hair); flex-shrink: 0; }
.drop:hover { color: var(--claret); }
.drop.live { width: auto; padding: 0 6px; font-family: var(--util); font-size: 9.5px; letter-spacing: .12em; text-transform: uppercase; color: var(--claret); }

/* ---- add ---- */
.add { padding-top: 22px; }
.add input { width: 100%; padding: 12px 13px; font-family: var(--text); font-size: 16px; color: var(--ink); background: transparent; border: 1px solid var(--hair); }
.add input::placeholder { color: var(--ink-45); }
.chips { display: flex; flex-wrap: wrap; align-items: center; gap: 7px; margin-top: 10px; }
.chip { padding: 7px 13px; font-size: 13px; font-weight: 300; color: var(--ink-70); border: 1px solid var(--hair); transition: background .14s ease; }
.chip:hover { border-color: var(--ink-45); }
.chip.on { background: var(--claret-soft); border-color: var(--claret); color: var(--claret); }
.primary { margin-left: auto; padding: 8px 20px; font-family: var(--util); font-size: 10px; letter-spacing: .16em; text-transform: uppercase; color: var(--sheet); background: var(--ink); }
.primary:disabled { background: var(--hair); color: var(--sheet); cursor: not-allowed; }

/* ---- standings ---- */
.board { list-style: none; margin: 0; padding: 0; counter-reset: none; }
.board li { display: flex; gap: 12px; padding: 14px 0; border-bottom: 1px solid var(--hair-soft); }
.board li:first-child { padding-top: 0; }
.board li:last-child { border-bottom: none; padding-bottom: 0; }
.ord { font-family: var(--util); font-size: 10px; color: var(--ink-45); padding-top: 5px; }
.board li:first-child .ord { color: var(--claret); }
.board-body { flex: 1; min-width: 0; }
.board-line { display: flex; align-items: baseline; gap: 10px; margin: 0; }
.board-name { font-size: 16px; line-height: 1.25; }
.board-num { margin-left: auto; font-family: var(--display); font-size: 23px; line-height: 1; }
.rail { display: block; height: 2px; background: var(--hair-soft); margin: 9px 0 7px; }
.rail span { display: block; height: 100%; background: var(--ink); transition: width .3s ease; }
.board li:first-child .rail span { background: var(--claret); }
.board li:first-child .board-num { color: var(--claret); }
.board-sub { font-size: 12.5px; font-weight: 300; color: var(--ink-45); margin: 0; }

/* ---- matrix ---- */
.matrix { display: grid; grid-template-columns: minmax(86px, 1.25fr) repeat(8, 1fr); gap: 3px; align-items: center; }
.mx-day { grid-column: span 4; font-family: var(--util); font-size: 9.5px; letter-spacing: .14em; text-transform: uppercase; color: var(--ink-45); text-align: center; padding-bottom: 3px; }
.mx-tick { font-family: var(--util); font-size: 9px; color: var(--ink-45); text-align: center; padding-bottom: 5px; }
.mx-name { font-size: 13px; font-weight: 300; color: var(--ink-70); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding-right: 8px; }
.mx-name.off { color: var(--ink-45); opacity: .45; }
.mx-cell { height: 18px; border: 1px solid var(--hair-soft); }
.mx-cell.on { background: var(--ink); border-color: var(--ink); }

/* ---- tools ---- */
.tools { display: flex; gap: 8px; flex-wrap: wrap; }
.ghost { padding: 8px 14px; font-family: var(--util); font-size: 9.5px; letter-spacing: .14em; text-transform: uppercase; color: var(--ink-45); border: 1px solid var(--hair); }
.ghost:hover { color: var(--ink); border-color: var(--ink-45); }
.ghost.live { color: var(--claret); border-color: var(--claret); }

@media (max-width: 800px) {
  .sheet { border-left: none; border-right: none; }
  .masthead { padding: 20px 20px 18px; }
  .folio { font-size: 9px; letter-spacing: .1em; gap: 8px; }
  .flag { min-width: 0; }
  .lede { padding: 30px 20px 28px; }
  .proof { padding: 12px 20px; gap: 12px; }
  .resume { padding: 10px 20px; gap: 10px; }
  .cols { grid-template-columns: 1fr; }
  .side { border-left: none; border-top: 1px solid var(--ink); }
  .block, .main .block { padding: 24px 20px; }
  .avail .cell { height: 50px; }
  .matrix { grid-template-columns: minmax(70px, 1fr) repeat(8, 1fr); }
  .mx-name { font-size: 12px; }
}
@media (prefers-reduced-motion: reduce) { .eb * { transition: none !important; } }


/* ---- venue panel ---- */
.locked .note { color: var(--ink-45); }
.next-up { margin: 18px 0 0; padding-top: 14px; border-top: 1px dashed var(--hair); font-size: 13px; line-height: 1.6; color: var(--ink-45); }
.spot-list { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--hair-soft); }
.spot-list li { display: flex; align-items: center; border-bottom: 1px solid var(--hair-soft); }
.spot-list button[data-spot] { flex: 1; display: flex; align-items: center; gap: 12px; padding: 12px 2px; text-align: left; min-width: 0; }
.spot-list .tick { flex: 0 0 auto; width: 15px; height: 15px; border: 1px solid var(--ink-45); }
.spot-list li.on .tick { background: var(--claret); border-color: var(--claret); box-shadow: inset 0 0 0 2.5px var(--sheet); }
.spot-body { min-width: 0; flex: 1; }
.spot-name { display: block; font-size: 15px; line-height: 1.3; }
.spot-list li.on .spot-name { color: var(--claret); }
.host-tag { font-family: var(--util); font-size: 9px; letter-spacing: .1em; text-transform: uppercase; color: var(--ink-45); font-style: normal; }
.spot-who { display: block; font-family: var(--util); font-size: 10px; color: var(--ink-45); margin-top: 3px; }
.spot-num { font-family: var(--display); font-size: 19px; color: var(--ink-45); padding-left: 8px; }
.spot-list li.on .spot-num { color: var(--claret); }
.spot-list .map-link { flex: 0 0 auto; padding-left: 8px; color: var(--ink-45); text-decoration: underline; }
.chip-ago { display: block; font-family: var(--util); font-size: 9px; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-45); margin-top: 2px; }
.spot .chips button { text-align: left; }

.my-spot { display: block; font-family: var(--util); font-size: 9.5px; letter-spacing: .08em; text-transform: uppercase; color: var(--claret); margin-top: 4px; }

/* ---- sitting out ---- */
.sitting { padding: 16px; border: 1px solid var(--hair); background: rgba(176,148,96,.09); }
.sitting p { margin: 0 0 8px; font-size: 14.5px; color: var(--ink-70); }
.sitting b { font-weight: 400; color: var(--ink); }
.mx-tag { font-family: var(--util); font-size: 8.5px; letter-spacing: .1em; text-transform: uppercase; font-style: normal; color: var(--ink-45); margin-left: 6px; }
.mx-out { color: var(--ink-45); }
.mx-quiet { color: var(--ink-45); opacity: .45; }
.mx-c-out { background: repeating-linear-gradient(45deg, transparent, transparent 2px, rgba(26,24,21,.09) 2px, rgba(26,24,21,.09) 3px); }
.mx-c-quiet { border-style: dashed; }

/* ---- discovery card ---- */
.find { margin-top: 16px; padding: 16px; border: 1px solid var(--claret); background: var(--claret-soft); }
.find-kicker { font-family: var(--util); font-size: 9.5px; letter-spacing: .16em; text-transform: uppercase; color: var(--claret); margin: 0 0 6px; }
.find-name { font-family: var(--display); font-size: 25px; line-height: 1.1; margin: 0 0 8px; }
.find-tags { margin: 0 0 6px; }
.find-tags span { display: inline-block; font-family: var(--util); font-size: 9.5px; letter-spacing: .08em; text-transform: uppercase; color: #7A3535; border: 1px solid rgba(138,43,43,.35); padding: 3px 8px; margin: 0 5px 5px 0; }
.find-dist { font-size: 12.5px; color: var(--ink-45); margin: 0 0 12px; }
.find .row-btns a.ghost { text-decoration: none; display: inline-block; }

/* ---- standings: who voted ---- */
.board-who { margin: 7px 0 0; font-family: var(--util); font-size: 11px; letter-spacing: .02em; line-height: 1.7; }
.board-who span { display: inline-block; }
.w-dot { color: var(--hair); padding: 0 6px; }
.w-free { color: var(--ink-70); }
.w-busy { color: var(--ink-45); opacity: .6; text-decoration: line-through; text-decoration-thickness: .5px; }

/* ---- section nav ---- */
.nav { display: flex; gap: 0; border-bottom: 1px solid var(--ink); background: var(--sheet); }
.nav button { flex: 1; padding: 13px 4px; font-family: var(--util); font-size: 10px; letter-spacing: .14em; text-transform: uppercase; color: var(--ink-45); border-right: 1px solid var(--hair-soft); }
.nav button:last-child { border-right: none; }
.nav button.on { color: var(--ink); box-shadow: inset 0 -2px 0 var(--claret); }
.nav .tag { font-family: var(--util); font-size: 9px; color: var(--claret); vertical-align: super; margin-left: 2px; }

/* ---- setup ---- */
.setup { padding: 30px 44px 34px; }
.setup h2 { font-family: var(--display); font-weight: 400; font-size: 30px; margin: 0 0 6px; }
.setup p { font-size: 15px; color: var(--ink-70); margin: 0 0 18px; max-width: 46ch; line-height: 1.55; }
.setup ol { margin: 0 0 20px; padding-left: 20px; font-size: 14px; color: var(--ink-70); line-height: 1.7; max-width: 48ch; }
.setup li { margin-bottom: 6px; }
.setup code { font-family: ui-monospace, monospace; font-size: 12.5px; background: rgba(176,148,96,.12); padding: 2px 5px; word-break: break-all; }
.setup input { width: 100%; max-width: 460px; padding: 12px 13px; font-family: var(--text); font-size: 15px; color: var(--ink); background: transparent; border: 1px solid var(--hair); }
.setup .primary { margin: 12px 0 0; display: inline-block; }
.setup .err { color: var(--claret); font-size: 13px; margin-top: 10px; }
.share-block input { width: 100%; padding: 11px 12px; font-family: var(--text); font-size: 13px; color: var(--ink-70); background: rgba(176,148,96,.07); border: 1px solid var(--hair); }
.tiny { font-size: 12.5px; color: var(--ink-45); margin-top: 10px; line-height: 1.55; }

/* ---- recap prompt + form ---- */
.recap-bar { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; padding: 13px 44px; background: rgba(176,148,96,.1); border-bottom: 1px solid var(--hair); }
.recap-bar p { flex: 1; min-width: 200px; margin: 0; font-size: 14px; color: var(--ink-70); }
.recap-bar b { color: var(--ink); font-weight: 400; }
.field { margin-bottom: 18px; }
.field > label { display: block; font-family: var(--util); font-size: 10px; letter-spacing: .14em; text-transform: uppercase; color: var(--ink-45); margin-bottom: 7px; }
.field input, .field select { width: 100%; padding: 11px 12px; font-family: var(--text); font-size: 15px; color: var(--ink); background: transparent; border: 1px solid var(--hair); border-radius: 0; -webkit-appearance: none; appearance: none; }
.field select { background-image: linear-gradient(45deg, transparent 50%, var(--ink-45) 50%), linear-gradient(135deg, var(--ink-45) 50%, transparent 50%); background-position: calc(100% - 18px) 50%, calc(100% - 13px) 50%; background-size: 5px 5px, 5px 5px; background-repeat: no-repeat; padding-right: 34px; }
.who-grid { display: flex; flex-wrap: wrap; gap: 6px; }
.who-grid button { padding: 8px 13px; font-size: 13px; color: var(--ink-70); border: 1px solid var(--hair); }
.who-grid button.on { background: var(--claret-soft); border-color: var(--claret); color: var(--claret); }
.row-btns { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }

/* ---- feed ---- */
.uploader { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 20px; }
.uploader .primary { flex-shrink: 0; }
.upload-note { font-size: 12.5px; color: var(--ink-45); }
.feed { display: grid; grid-template-columns: repeat(3, 1fr); gap: 3px; }
.shot { position: relative; padding-top: 100%; overflow: hidden; background: rgba(176,148,96,.12); cursor: pointer; }
.shot img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: block; }
.shot.pending::after { content: ""; position: absolute; left: 50%; top: 50%; width: 14px; height: 14px; margin: -7px 0 0 -7px; border: 1px solid var(--hair); border-top-color: var(--claret); border-radius: 50%; animation: spin .8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.shot-cap { position: absolute; left: 0; right: 0; bottom: 0; padding: 14px 7px 5px; font-size: 10px; color: #fff; background: linear-gradient(transparent, rgba(0,0,0,.62)); line-height: 1.3; }
.lightbox { position: fixed; inset: 0; background: rgba(20,18,15,.94); z-index: 50; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 18px; }
.lightbox img { max-width: 100%; max-height: 76vh; object-fit: contain; }
.lightbox p { color: #EDE6D8; font-size: 14px; margin: 14px 0 0; text-align: center; max-width: 40ch; }
.lightbox .meta { font-family: var(--util); font-size: 10px; letter-spacing: .12em; text-transform: uppercase; color: #A79A82; margin-top: 5px; }
.lightbox button { position: absolute; top: 16px; right: 16px; width: 42px; height: 42px; font: 400 26px/1 ui-sans-serif, system-ui, sans-serif;
  color: #FBF6EA; background: rgba(20,18,15,.55); border: 1px solid rgba(251,246,234,.45); border-radius: 50%;
  -webkit-appearance: none; appearance: none; cursor: pointer; display: flex; align-items: center; justify-content: center; padding: 0;
  backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); }
.lightbox button:active { background: rgba(251,246,234,.2); }
.more-row { text-align: center; margin-top: 18px; }

/* ---- month grid ---- */
.cal-nav { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
.cal-nav b { font-family: var(--display); font-size: 24px; font-weight: 400; }
.cal-nav button { padding: 8px 14px; font-family: var(--util); font-size: 14px; color: var(--ink-45); border: 1px solid var(--hair); }
.cal-nav button:hover { color: var(--claret); border-color: var(--claret); }

.strip span { padding-top: 100%; background: rgba(176,148,96,.16); border-radius: 1px; }

@media (max-width: 800px) {
  .setup { padding: 24px 20px 28px; }

<body>
<div class="eb">
  <div class="sheet">
    <header class="masthead">
      <p class="folio">
        <span id="folio-no">&nbsp;</span>
        <span class="folio-mid" id="folio-date">&nbsp;</span>
        <span class="flag" id="flag">Loading</span>
      </p>
      <svg class="ornament" viewBox="0 0 40 40" width="36" height="36" aria-hidden="true" id="ornament"></svg>
      <h1>Everything Bagel</h1>
    </header>
    <div id="nav"></div>
    <div id="resume-bar"></div>
    <div id="notice"></div>
    <div id="app"></div>
  </div>
</div>
<div id="overlay"></div>
<input type="file" id="photo-input" accept="image/*" multiple style="display:none" />

<script>
/* ==================================================================
   Everything Bagel
   Poll + photo feed + calendar + venue log.
   Shared state: Firebase Realtime Database over plain REST.
   Photos are downscaled in the browser and stored as JPEG data URLs,
   which keeps the whole thing on Firebase's no-card free plan.
   ================================================================== */

var FAMILIES = [
  { id: "h1", label: "Haran + Jerry",  kids: ["Kaeden", "Nolan"] },
  { id: "h2", label: "Fei + Albert",   kids: ["Wilson"] },
  { id: "h3", label: "Anna + Oliver",  kids: ["Logan"] },
  { id: "h4", label: "Esther + Jon",   kids: ["Ellie", "Elijah"] },
  { id: "h5", label: "Judy + Grant",   kids: ["Aurelia", "Archie"] }
];
var FAM = {}; FAMILIES.forEach(function (f) { FAM[f.id] = f; });
var MAJORITY = Math.floor(FAMILIES.length / 2) + 1;

var DAYS = [ { id: "sat", label: "Saturday", short: "Sat" }, { id: "sun", label: "Sunday", short: "Sun" } ];
var SLOTS = [
  { id: "morning", label: "Morning", tick: "M" },
  { id: "lunch", label: "Lunch", tick: "L" },
  { id: "afternoon", label: "Afternoon", tick: "A" },
  { id: "dinner", label: "Dinner", tick: "D" }
];
var SLOT_LABEL = {}, DAY_LABEL = {};
SLOTS.forEach(function (s) { SLOT_LABEL[s.id] = s.label; });
DAYS.forEach(function (d) { DAY_LABEL[d.id] = d.label; });

/* Everyone lives in central/south Orange County. Suggestions and the
   roulette stay inside this box so nothing lands 40 minutes away. */
var AREA = {
  /* Four of the five families are in Irvine or North Tustin, so the centre sits
     there rather than at the geometric middle, which Laguna Niguel drags south. */
  lat: 33.690, lon: -117.792,
  minLat: 33.50, maxLat: 33.83,
  minLon: -117.97, maxLon: -117.62,
  maxKm: 24,        // far enough to include Laguna Niguel, not Dana Point
  decayKm: 7        // how fast a suggestion loses out for being further away
};
function kmFrom(lat, lon) {
  if (typeof lat !== "number" || typeof lon !== "number") return 999;
  var dLat = (lat - AREA.lat) * 111;
  var dLon = (lon - AREA.lon) * 111 * Math.cos(AREA.lat * Math.PI / 180);
  return Math.sqrt(dLat * dLat + dLon * dLon);
}
function inArea(lat, lon) {
  if (typeof lat !== "number" || typeof lon !== "number") return true; // unknown: don't exclude
  return lat >= AREA.minLat && lat <= AREA.maxLat && lon >= AREA.minLon && lon <= AREA.maxLon;
}

var DEFAULT_ACTIVITIES = [
  { id: "a-park",   name: "Park + playground", slots: ["morning", "afternoon"] },
  { id: "a-brunch", name: "Brunch",            slots: ["morning", "lunch"] },
  { id: "a-lunch",  name: "Lunch",             slots: ["lunch"] },
  { id: "a-coffee", name: "Coffee",            slots: ["morning", "afternoon"] },
  { id: "a-dinner", name: "Dinner",            slots: ["dinner"] },
  { id: "a-beach",  name: "Beach",             slots: ["morning", "lunch", "afternoon"] },
  { id: "a-pool",   name: "Pool day",          slots: ["morning", "lunch", "afternoon"] }
];

/* ---------- dates ---------- */
function saturdayOf(now) {
  var d = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  var dow = d.getDay();
  d.setDate(d.getDate() + (dow === 0 ? -1 : 6 - dow));
  return d;
}
function weekNumber(d) {
  var t = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
  var day = t.getUTCDay() || 7;
  t.setUTCDate(t.getUTCDate() + 4 - day);
  var jan1 = new Date(Date.UTC(t.getUTCFullYear(), 0, 1));
  return Math.ceil(((t - jan1) / 86400000 + 1) / 7);
}
function iso(d) { return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); }
function fromIso(s) { var p = String(s).split("-").map(Number); return new Date(p[0], p[1] - 1, p[2]); }
function shiftWeeks(d, n) { return new Date(d.getFullYear(), d.getMonth(), d.getDate() + n * 7); }
function agoText(dateStr) {
  var days = Math.round((new Date() - fromIso(dateStr)) / 86400000);
  if (days < 10) return "last weekend";
  if (days < 45) return Math.round(days / 7) + " weeks ago";
  if (days < 350) return Math.round(days / 30) + " months ago";
  return Math.round(days / 365) + "y ago";
}

var TODAY = new Date();
var SAT = saturdayOf(TODAY);
var SUN = new Date(SAT.getFullYear(), SAT.getMonth(), SAT.getDate() + 1);
var PREV = shiftWeeks(SAT, -1);
var WEEK = iso(SAT);
var DATELINE = SAT.getMonth() === SUN.getMonth()
  ? SAT.toLocaleDateString("en-US", { month: "long", day: "numeric" }) + "\u2013" + SUN.getDate()
  : SAT.toLocaleDateString("en-US", { month: "long", day: "numeric" }) + " \u2013 " + SUN.toLocaleDateString("en-US", { month: "long", day: "numeric" });

/* ---------- state ---------- */
var S = {
  db: null, me: null, resumed: false, view: "poll",
  data: { activities: DEFAULT_ACTIVITIES.slice(), votes: {} },
  log: null, photoMeta: null, photoData: {},
  feedShown: 9, status: "loading", newSlots: [], confirming: null,
  recap: null, lightbox: null, uploading: 0, setupError: null
};
var BLANK = { out: false, picks: [], avail: { sat: [], sun: [] } };
var saveTimer = null, dirty = false, pendingActivities = false, wipeAll = false, pendingSpot = false;
var pendingName = "";

function esc(t) {
  return String(t === undefined || t === null ? "" : t)
    .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;").replace(/'/g, "&#39;");
}
function ls(k, v) {
  try {
    if (v === undefined) return localStorage.getItem(k);
    if (v === null) localStorage.removeItem(k); else localStorage.setItem(k, v);
  } catch (e) {}
  return null;
}

/* ---------- database ---------- */
function normalizeDb(raw) {
  var v = String(raw || "").trim().replace(/\s/g, "");
  if (!v) return null;
  v = v.replace(/^https?:\/\//, "").replace(/\/+$/, "").replace(/\.json.*$/, "");
  if (!/^[a-z0-9-]+(-default-rtdb)?(\.[a-z0-9-]+)*\.(firebaseio\.com|firebasedatabase\.app)$/i.test(v)) return null;
  return "https://" + v;
}
function readNs() {
  var m = /[?&]ns=([a-zA-Z0-9-]{1,20})/.exec(location.search || "");
  return m ? m[1].toLowerCase() : "";
}
var NS = readNs();

function readDbFromUrl() {
  var m = /[?&]db=([^&#]+)/.exec(location.search || "");
  if (!m) m = /[#&]db=([^&]+)/.exec(location.hash || "");
  return m ? normalizeDb(decodeURIComponent(m[1])) : null;
}
function url(p) { return S.db + (NS ? "/" + NS : "") + p + ".json"; }
function req(method, path, body) {
  var o = { method: method };
  if (body !== undefined) { o.headers = { "Content-Type": "application/json" }; o.body = JSON.stringify(body); }
  return fetch(url(path), o).then(function (r) {
    if (!r.ok) throw new Error("http " + r.status);
    return r.status === 204 ? null : r.json();
  });
}

function normalize(raw) {
  var out = { activities: [], votes: {}, spots: {} };
  var sp = (raw && raw.spots) || {};
  Object.keys(sp).forEach(function (fid) {
    if (!FAM[fid] || !sp[fid] || !sp[fid].name) return;
    out.spots[fid] = {
      name: String(sp[fid].name).slice(0, 80),
      sub: sp[fid].sub ? String(sp[fid].sub).slice(0, 90) : null,
      lat: typeof sp[fid].lat === "number" ? sp[fid].lat : null,
      lon: typeof sp[fid].lon === "number" ? sp[fid].lon : null,
      host: !!sp[fid].host,
      act: sp[fid].act ? String(sp[fid].act) : null
    };
  });
  if (raw && Array.isArray(raw.activities)) {
    out.activities = raw.activities.filter(Boolean).map(function (a) {
      return {
        id: String(a.id), name: String(a.name || "").slice(0, 80),
        slots: (Array.isArray(a.slots) ? a.slots : []).filter(function (s) { return SLOT_LABEL[s]; }),
        by: a.by && FAM[a.by] ? a.by : null
      };
    });
  }
  var votes = (raw && raw.votes) || {};
  Object.keys(votes).forEach(function (fid) {
    if (!FAM[fid]) return;
    var v = votes[fid] || {};
    out.votes[fid] = {
      out: !!v.out,
      picks: Array.isArray(v.picks) ? v.picks : [],
      avail: {
        sat: (v.avail && Array.isArray(v.avail.sat)) ? v.avail.sat : [],
        sun: (v.avail && Array.isArray(v.avail.sun)) ? v.avail.sun : []
      }
    };
  });
  return out;
}

/* ---------- boot + live ---------- */
function boot() {
  setStatus("loading");
  req("GET", "/weekends/" + WEEK).then(function (raw) {
    if (raw && raw.activities) { S.data = normalize(raw); render(); subscribe(); return; }
    var votesSoFar = raw && raw.votes ? normalize(raw).votes : {};
    return req("GET", "/weekends/" + iso(PREV) + "/activities").then(function (prev) {
      var acts = Array.isArray(prev) && prev.length ? normalize({ activities: prev }).activities : DEFAULT_ACTIVITIES.slice();
      DEFAULT_ACTIVITIES.forEach(function (d) {                 // pick up any newly-standard options
        if (!acts.some(function (a) { return a.id === d.id; })) acts.push(d);
      });
      S.data = { activities: acts, votes: votesSoFar, spots: (raw && normalize(raw).spots) || {} };
      pendingActivities = true;
      render(); subscribe();
    });
  }).then(function () { setStatus("ok"); loadLog(); })
    .catch(function () { setStatus("error"); render(); subscribe(); });
}
function subscribe() {
  if (!window.EventSource) { setInterval(refresh, 12000); return; }
  try {
    var es = new EventSource(url("/weekends/" + WEEK));
    es.addEventListener("put", function () { if (!dirty) refresh(); });
    es.addEventListener("patch", function () { if (!dirty) refresh(); });
    es.onopen = function () { S.live = true; };
    es.onerror = function () { S.live = false; };
  } catch (e) { setInterval(refresh, 12000); }
  setInterval(function () { if (!S.live) refresh(); }, 20000);
}
function refresh() {
  if (dirty || !S.db) return;
  req("GET", "/weekends/" + WEEK).then(function (raw) {
    if (dirty) return;
    var n = normalize(raw || {});
    if (!n.activities.length) n.activities = S.data.activities;
    S.data = n; setStatus("ok"); render();
  }).catch(function () { setStatus("error"); });
}
/* Entries are keyed by the actual date they happened. Older entries were keyed
   by the weekend's Saturday with a sat/sun flag, so those get remapped on read. */
function migrateLog(raw) {
  var out = {};
  Object.keys(raw || {}).forEach(function (k) {
    var e = raw[k];
    if (!e) return;
    var key = k;
    if (e.day === "sun" && fromIso(k).getDay() === 6) key = iso(new Date(fromIso(k).getFullYear(), fromIso(k).getMonth(), fromIso(k).getDate() + 1));
    out[key] = e;
  });
  return out;
}
function loadLog(force) {
  if (S.log && !force) return Promise.resolve(S.log);
  return req("GET", "/log").then(function (raw) {
    S.log = migrateLog(raw || {});
    render();
    return S.log;
  }).catch(function () { S.log = S.log || {}; return S.log; });
}
function loadPhotoMeta(force) {
  if (S.photoMeta && !force) return Promise.resolve(S.photoMeta);
  return req("GET", "/photoMeta").then(function (raw) {
    S.photoMeta = raw || {};
    render();
    return S.photoMeta;
  }).catch(function () { S.photoMeta = S.photoMeta || {}; return S.photoMeta; });
}
function loadPhoto(id) {
  if (S.photoData[id] !== undefined) return;
  S.photoData[id] = null; // pending
  req("GET", "/photoData/" + id).then(function (d) {
    S.photoData[id] = d || "";
    var el = document.querySelector('[data-shot="' + id + '"]');
    if (el && d) { el.classList.remove("pending"); el.insertAdjacentHTML("afterbegin", '<img src="' + d + '" alt="" />'); }
  }).catch(function () { S.photoData[id] = ""; });
}

/* ---------- writes ---------- */
function apply(fn) {
  S.resumed = false; dirty = true; fn(); setStatus("saving"); render();
  if (saveTimer) clearTimeout(saveTimer);
  saveTimer = setTimeout(flush, 450);
}
function flush() {
  if (!S.db) { dirty = false; return; }
  var jobs = [], base = "/weekends/" + WEEK;
  if (pendingActivities) { pendingActivities = false; jobs.push(req("PUT", base + "/activities", S.data.activities)); }
  if (S.me) {
    var mine = S.data.votes[S.me];
    jobs.push(mine ? req("PUT", base + "/votes/" + S.me, mine) : req("DELETE", base + "/votes/" + S.me));
    if (pendingSpot) {
      pendingSpot = false;
      var sp = S.data.spots && S.data.spots[S.me];
      jobs.push(sp ? req("PUT", base + "/spots/" + S.me, sp) : req("DELETE", base + "/spots/" + S.me));
    }
  }
  if (wipeAll) { wipeAll = false; jobs.push(req("DELETE", base + "/votes")); }
  Promise.all(jobs).then(function () { dirty = false; setStatus("ok"); })
    .catch(function () { dirty = false; setStatus("error"); });
}
function eligibleActivities() {
  return tally().filter(function (r) { return r.best.who.length >= 2; });
}
/* Don't let the panel jump between activities as votes wobble: stay on the one
   we're already showing while it still qualifies. */
function spotActivity() {
  var elig = eligibleActivities();
  if (!elig.length) return null;
  if (S.spotAct) {
    var kept = elig.filter(function (r) { return r.activity.id === S.spotAct; })[0];
    if (kept) return kept;
  }
  return elig[0];
}
function leadActivityId() {
  var r = spotActivity();
  return r ? r.activity.id : null;
}
function setSpot(name, lat, lon, host, sub) {
  if (!S.me) return;
  var act = leadActivityId();
  apply(function () {
    if (!S.data.spots) S.data.spots = {};
    S.data.spots[S.me] = {
      name: name, sub: sub || null,

        && inArea(v.lat, v.lon) && kmFrom(v.lat, v.lon) <= AREA.maxKm
        && !seen[v.name.trim().toLowerCase()];
    });
  }).catch(function () { return null; });
}
/* Prefer places that look built for kids, then closer to the middle of everyone. */
function pickNew(list) {
  if (!list.length) return null;
  var scored = list.map(function (v) {
    var near = Math.exp(-kmFrom(v.lat, v.lon) / AREA.decayKm);
    var w = (1 + v.kid.length * 2) * Math.max(0.03, near);
    return { v: v, w: w };
  });
  var total = scored.reduce(function (a, b) { return a + b.w; }, 0);
  var r = Math.random() * total;
  for (var i = 0; i < scored.length; i++) { r -= scored[i].w; if (r <= 0) return scored[i].v; }
  return scored[scored.length - 1].v;
}

/* ---------- photo compression ---------- */
function compress(file, maxDim, quality) {
  return new Promise(function (resolve, reject) {
    var objUrl = URL.createObjectURL(file);
    var img = new Image();
    img.onload = function () {
      var w = img.naturalWidth, h = img.naturalHeight;
      var scale = Math.min(1, maxDim / Math.max(w, h));
      var cw = Math.max(1, Math.round(w * scale)), ch = Math.max(1, Math.round(h * scale));
      var c = document.createElement("canvas");
      c.width = cw; c.height = ch;
      var ctx = c.getContext("2d");
      ctx.fillStyle = "#fff"; ctx.fillRect(0, 0, cw, ch);
      ctx.drawImage(img, 0, 0, cw, ch);
      URL.revokeObjectURL(objUrl);
      var q = quality, out = c.toDataURL("image/jpeg", q);
      // keep every photo comfortably small; step quality down if needed
      while (out.length > 420000 && q > 0.4) { q -= 0.12; out = c.toDataURL("image/jpeg", q); }
      resolve(out);
    };
    img.onerror = function () { URL.revokeObjectURL(objUrl); reject(new Error("decode")); };
    img.src = objUrl;
  });
}
function uploadPhotos(files) {
  if (!S.me) { alert("Pick your family first, on the Poll tab."); return; }
  var week = S.photoWeek || WEEK;
  var list = Array.prototype.slice.call(files).slice(0, 12);
  S.uploading = list.length;
  setStatus("uploading"); render();
  var chain = Promise.resolve();
  list.forEach(function (file) {
    chain = chain.then(function () {
      return compress(file, 1600, 0.72).then(function (dataUrl) {
        var id = "p" + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
        return req("PUT", "/photoData/" + id, dataUrl).then(function () {
          return req("PUT", "/photoMeta/" + week + "/" + id, { caption: "", by: S.me, ts: Date.now() });
        }).then(function () {
          if (!S.photoMeta) S.photoMeta = {};
          if (!S.photoMeta[week]) S.photoMeta[week] = {};
          S.photoMeta[week][id] = { caption: "", by: S.me, ts: Date.now() };
          S.photoData[id] = dataUrl;
          S.uploading--; render();
        });
      }).catch(function () { S.uploading--; render(); });
    });
  });
  chain.then(function () { S.uploading = 0; setStatus("ok"); render(); });
}

function captureRecap() {
  var a = document.getElementById("r-act"), o = document.getElementById("r-act-other"),
      v = document.getElementById("r-venue"), d = document.getElementById("r-date");
  if (!a) return;
  S.recapDraft = { act: a.value, other: o ? o.value : "", venue: v ? v.value : "", date: d ? d.value : S.recap };
}
function viewRecapForm() {
  var key = S.recap, e = (S.log && S.log[key]) || {};
  var draft = S.recapDraft || {};
  var dateVal = draft.date || key;
  var d = fromIso(dateVal);
  var wkData = S.recapSource || { activities: S.data.activities };
  var acts = wkData.activities && wkData.activities.length ? wkData.activities : S.data.activities;
  var curAct = draft.act !== undefined ? draft.act : (e.activityName || (acts[0] && acts[0].name));
  var isOther = curAct === "__other" || (curAct && acts.every(function (a) { return a.name !== curAct; }));
  var otherVal = draft.other !== undefined ? draft.other : (isOther ? (e.activityName || "") : "");
  var venueVal = draft.venue !== undefined ? draft.venue : (e.venue || "");
  var chosenWho = S.recapWho || [];
  var isEdit = !!(S.log && S.log[key]);
  return '<section class="block"><h3 class="rule-head"><span>' + (isEdit ? "Edit" : "Log") + ' a get-together</span></h3>'
    + '<div class="field"><label>When was it?</label><input type="date" id="r-date" value="' + esc(dateVal) + '" max="' + esc(iso(TODAY)) + '" />'
    + '<p class="tiny">' + d.toLocaleDateString("en-US", { weekday: "long", month: "long", day: "numeric", year: "numeric" })
    + ' \u2014 any past date works, so you can fill in history.</p></div>'
    + '<div class="field"><label>What did you do?</label><select id="r-act">'
    + acts.map(function (a) { return '<option value="' + esc(a.name) + '"' + (!isOther && a.name === curAct ? " selected" : "") + '>' + esc(a.name) + '</option>'; }).join("")
    + '<option value="__other"' + (isOther ? " selected" : "") + '>Something else\u2026</option></select></div>'
    + '<div class="field"><label>Or type it</label><input id="r-act-other" placeholder="Only if you picked Something else" value="' + esc(otherVal) + '" /></div>'
    + '<div class="field"><label>Where?</label>'
    + '<input id="r-venue" autocomplete="off" placeholder="Start typing a place" value="' + esc(venueVal) + '" />'
    + '<div class="suggest" id="venue-suggest"></div>'
    + (S.recapVenue && S.recapVenue.lat ? '<p class="tiny">Pinned on the map \u2014 the calendar entry will link straight to it.</p>' : "")
    + '</div>'
    + '<div class="field"><label>Who came?</label><div class="who-grid">'
    + FAMILIES.map(function (f) { return '<button data-who="' + f.id + '" class="' + (chosenWho.indexOf(f.id) > -1 ? "on" : "") + '">' + esc(f.label) + '</button>'; }).join("")
    + '</div></div>'
    + '<div class="row-btns"><button class="primary" id="r-save">Save to calendar</button>'
    + '<button class="ghost" id="r-cancel">Cancel</button>'
    + (isEdit ? '<button class="ghost' + (S.confirming === "del" ? " live" : "") + '" id="r-delete">' + (S.confirming === "del" ? "Delete this entry" : "Delete") + '</button>' : "")
    + '</div></section>';
}

function viewFeed() {
  var shots = photoList(), out = "";
  var weeks = [];
  for (var wi = 0; wi < 10; wi++) {
    var wd = shiftWeeks(SAT, -wi);
    weeks.push({ id: iso(wd), label: wd.toLocaleDateString("en-US", { month: "short", day: "numeric" }) + (wi === 0 ? " (this weekend)" : "") });
  }
  var chosenWeek = S.photoWeek || WEEK;
  out += '<section class="block"><h3 class="rule-head"><span>Add photos</span></h3>'
    + '<div class="field"><label>Which weekend</label><select id="photo-week">'
    + weeks.map(function (w) { return '<option value="' + w.id + '"' + (w.id === chosenWeek ? " selected" : "") + '>' + esc(w.label) + '</option>'; }).join("")
    + '</select></div><div class="uploader">'
    + '<button class="primary" id="pick-photos">Choose photos</button>'
    + '<span class="upload-note">' + (S.uploading ? S.uploading + " uploading\u2026"
        : "Shrunk to about 250KB each before upload, so the free database lasts years.") + '</span></div></section>';

  out += '<section class="block"><h3 class="rule-head"><span>The feed</span></h3>';
  if (!S.photoMeta) return out + '<p class="empty">Loading\u2026</p></section>';
  if (!shots.length) {
    return out + '<p class="empty">No photos yet. Add a few from a weekend you\u2019ve already had \u2014 they\u2019ll show up here and on the calendar.</p></section>';
  }
  out += '<div class="feed">';
  shots.slice(0, S.feedShown).forEach(function (p) {
    var have = S.photoData[p.id];
    var who = p.by && FAM[p.by] ? FAM[p.by].label.split(" + ")[0] : "";
    out += '<div class="shot' + (have ? "" : " pending") + '" data-shot="' + esc(p.id) + '" data-open="' + esc(p.id) + '">'
      + (have ? '<img src="' + have + '" alt="" />' : "")
      + (who ? '<span class="shot-cap">' + esc(who) + '</span>' : "") + '</div>';
  });
  out += '</div>';
  if (shots.length > S.feedShown) out += '<div class="more-row"><button class="ghost" id="more-shots">Show more</button></div>';
  return out + '</section>';
}
function entriesByDate() {
  var map = {};
  logEntries().forEach(function (e) { map[e.date] = e; });
  return map;
}
function viewCalendar() {
  if (!S.log) return '<section class="block"><p class="empty">Loading\u2026</p></section>';
  if (S.dayDetail) return viewDayDetail();

  var cur = S.calMonth ? fromIso(S.calMonth) : new Date(TODAY.getFullYear(), TODAY.getMonth(), 1);
  var year = cur.getFullYear(), month = cur.getMonth();
  var first = new Date(year, month, 1), lastDay = new Date(year, month + 1, 0).getDate();
  var byDate = entriesByDate();
  var out = '<section class="block"><div class="cal-nav">'
    + '<button data-month="' + iso(new Date(year, month - 1, 1)) + '">\u2039</button>'
    + '<b>' + first.toLocaleDateString("en-US", { month: "long", year: "numeric" }) + '</b>'
    + '<button data-month="' + iso(new Date(year, month + 1, 1)) + '">\u203a</button></div>';
  out += '<div class="cal-grid">';
  ["S","M","T","W","T","F","S"].forEach(function (l) { out += '<span class="cal-dow">' + l + '</span>'; });
  for (var b = 0; b < first.getDay(); b++) out += '<span class="cal-day blank"></span>';
  for (var day = 1; day <= lastDay; day++) {
    var key = iso(new Date(year, month, day));
    var e = byDate[key];
    var isToday = key === iso(TODAY);
    var future = fromIso(key) > TODAY;
    out += '<button class="cal-day' + (e ? " has" : "") + (isToday ? " today" : "") + (future ? " future" : "") + '"'
      + (future ? ' disabled' : (e ? ' data-day="' + key + '"' : ' data-log="' + key + '"')) + '>' + day
      + (e ? '<span class="dot"></span><span class="mini">' + esc((e.activityName || "").split(" ")[0]) + '</span>' : "")
      + '</button>';
  }
  out += '</div>';
  var count = Object.keys(byDate).filter(function (k) { return fromIso(k).getMonth() === month && fromIso(k).getFullYear() === year; }).length;
  out += '<p class="note">' + (count ? count + " get-together" + (count === 1 ? "" : "s") + " this month. "
    : "Nothing logged this month yet. ") + 'Tap any past day to log one \u2014 including old ones, if you want to fill in history.</p>';
  return out + '</section>';
}
function viewDayDetail() {
  var e = entriesByDate()[S.dayDetail];
  if (!e) { S.dayDetail = null; return viewCalendar(); }
  var d = fromIso(S.dayDetail);
  var link = mapsUrl(e);
  var shots = photoList().filter(function (p) { return p.week === e.week; });
  var out = '<section class="block"><button class="link" id="back-cal">\u2039 back to the month</button>'
    + '<p class="detail-date" style="margin-top:14px">' + d.toLocaleDateString("en-US", { weekday: "long", month: "long", day: "numeric", year: "numeric" }) + '</p>'
    + '<h2 class="detail-what">' + esc(e.activityName || "Got together") + '</h2>';
  if (e.venue) {
    out += '<p class="detail-venue">' + esc(e.venue)
      + (link ? '<a class="map-link" href="' + esc(link) + '" target="_blank" rel="noopener">open in maps</a>' : "") + '</p>';
  }
  out += '<p class="detail-who">' + ((e.who || []).length
    ? (e.who || []).map(function (f) { return FAM[f] ? esc(FAM[f].label) : ""; }).filter(Boolean).join(" \u00b7 ")
    : "Nobody recorded") + '</p>';
  out += '<div class="row-btns" style="margin-top:18px"><button class="ghost" data-recap="' + e.week + '">Edit</button></div></section>';

  out += '<section class="block"><h3 class="rule-head"><span>Photos from that weekend</span></h3>';
  if (!shots.length) {
    out += '<p class="empty">None yet. Add some from the Feed tab and pick this weekend.</p>';
  } else {
    out += '<div class="feed">' + shots.map(function (p) {
      var have = S.photoData[p.id];
      return '<div class="shot' + (have ? "" : " pending") + '" data-shot="' + esc(p.id) + '" data-open="' + esc(p.id) + '">'
        + (have ? '<img src="' + have + '" alt="" />' : "") + '</div>';
    }).join("") + '</div>';
  }
  return out + '</section>';
}

function viewPlaces() {
  if (!S.log) return '<section class="block"><p class="empty">Loading\u2026</p></section>';
  var entries = logEntries();
  var stats = venueStats();
  var keys = Object.keys(stats);
  var out = "";

  /* ---- headline numbers + year strip ---- */
  var yr = S.statYear || TODAY.getFullYear();
  var years = {};
  entries.forEach(function (e) { years[fromIso(e.date).getFullYear()] = 1; });
  years[TODAY.getFullYear()] = 1;
  var yearList = Object.keys(years).sort();
  var inYear = entries.filter(function (e) { return fromIso(e.date).getFullYear() === Number(yr); });
  var weeksOn = {};
  inYear.forEach(function (e) { weeksOn[weekNumber(fromIso(e.date))] = 1; });

  out += '<section class="block"><h3 class="rule-head"><span>' + yr + ' so far</span></h3>';
  out += '<div class="stat-row">'
    + '<div class="stat"><b>' + inYear.length + '</b><span>weekends together</span></div>'
    + '<div class="stat"><b>' + keys.length + '</b><span>places all time</span></div>'
    + '<div class="stat"><b>' + photoList().length + '</b><span>photos</span></div></div>';
  out += '<div class="strip">';
  for (var w = 1; w <= 52; w++) {
    out += '<span class="' + (weeksOn[w] ? "on" : "") + (Number(yr) === TODAY.getFullYear() && w === weekNumber(SAT) ? " now" : "") + '"></span>';
  }
  out += '</div><p class="note">Each cell is a week of ' + yr + '; filled means you got together. '
    + (longestStreak() > 1 ? "Longest run so far: " + longestStreak() + " weekends back to back." : "") + '</p>';
  if (yearList.length > 1) {
    out += '<div class="row-btns" style="margin-top:12px">' + yearList.map(function (y) {
      return '<button class="ghost' + (Number(y) === Number(yr) ? " live" : "") + '" data-year="' + y + '">' + y + '</button>';
    }).join("") + '</div>';
  }
  out += '</section>';

  /* ---- milestones ---- */
  var miles = milestones();
  out += '<section class="block miles"><h3 class="rule-head"><span>Milestones</span></h3>';
  if (!miles.length) {
    out += '<p class="empty">These show up as the log fills in \u2014 first visits, repeat spots, weekends when everyone made it.</p>';
  } else {
    out += '<ul>' + miles.map(function (m) {
      return '<li><span class="mile-mark"></span><div class="mile-body"><p class="mile-what">' + esc(m.text) + '</p>'
        + '<p class="mile-when">' + fromIso(m.week).toLocaleDateString("en-US", { month: "long", day: "numeric", year: "numeric" }) + '</p></div></li>';
    }).join("") + '</ul>';
  }
  out += '</section>';

  /* ---- who you've seen ---- */
  var att = attendance();
  out += '<section class="block att"><h3 class="rule-head"><span>Who you\u2019ve seen</span></h3><ul>'
    + FAMILIES.map(function (f) {
        var n = att.counts[f.id] || 0;
        var pct = att.total ? (n / att.total) * 100 : 0;
        return '<li><span class="att-name">' + esc(f.label) + '</span>'
          + '<span class="att-bar"><span style="width:' + pct + '%"></span></span>'
          + '<span class="att-num">' + n + ' of ' + att.total + '</span></li>';
      }).join("")
    + '</ul><p class="note">Out of ' + att.total + ' weekend' + (att.total === 1 ? "" : "s") + ' logged. Life gets in the way \u2014 this is a record, not a scoreboard.</p></section>';

  /* ---- seasons ---- */
  var sb = seasonBreakdown();
  out += '<section class="block"><h3 class="rule-head"><span>By season</span></h3>';
  if (!entries.length) {
    out += '<p class="empty">Patterns show up here once there are a few weekends logged \u2014 beaches in July, dinners in January.</p>';
  } else {
    SEASONS.forEach(function (sn) {
      var b = sb[sn.id];
      out += '<div class="season"><div class="season-head"><span class="season-name">' + sn.label + '</span>'
        + '<span class="season-top">' + esc(b.ranked[0] || "\u2014") + '</span>'
        + '<span class="season-count">' + b.total + ' weekend' + (b.total === 1 ? "" : "s") + '</span></div>'
        + (b.ranked.length > 1 ? '<p class="season-list">then ' + b.ranked.slice(1, 4).map(function (a) { return esc(a) + " (" + b.acts[a] + ")"; }).join(", ") + '</p>' : "")
        + '</div>';
    });
  }
  out += '</section>';

  /* ---- venues ---- */
  out += '<section class="block"><h3 class="rule-head"><span>Every place</span></h3>';
  if (!keys.length) {
    out += '<p class="empty">No venues yet. Add one when you log a weekend and it\u2019ll be offered as a suggestion from then on.</p></section>';
  } else {
    keys.sort(function (a, b) { return stats[b].count - stats[a].count || (stats[b].last > stats[a].last ? 1 : -1); });
    out += '<table class="places"><thead><tr><th>Place</th><th>Last visit</th><th>Times</th></tr></thead><tbody>';
    keys.forEach(function (k) {
      var v = stats[k];
      var ml = mapsUrl(v);
      out += '<tr><td><span class="venue">' + esc(v.name)
        + (ml ? ' <a class="map-link" href="' + esc(ml) + '" target="_blank" rel="noopener">map</a>' : "") + '</span>'
        + (v.activity ? '<span class="venue-sub">' + esc(v.activity) + '</span>' : "") + '</td>'
        + '<td>' + agoText(v.last) + '</td><td><span class="num">' + v.count + '</span></td></tr>';
    });
    out += '</tbody></table></section>';

    var stale = keys.filter(function (k) { return (new Date() - fromIso(stats[k].last)) / 86400000 > 60; });
    if (stale.length) {
      stale.sort(function (a, b) { return stats[a].last > stats[b].last ? 1 : -1; });
      out += '<section class="block stale"><h3 class="rule-head"><span>Overdue for a return</span></h3><ul>'
        + stale.slice(0, 6).map(function (k) { return '<li>' + esc(stats[k].name) + '<span>' + agoText(stats[k].last) + '</span></li>'; }).join("")
        + '</ul></section>';
    }
  }

  out += '<section class="block"><h3 class="rule-head"><span>Housekeeping</span></h3>'
    + '<div class="row-btns"><button class="ghost" id="backup">Download a backup</button>'
    + '<button class="ghost" id="backup-full">Backup with photos</button></div>'
    + '<p class="note">The first is small \u2014 every vote, weekend log and photo caption, but not the images themselves. '
    + 'The second includes the photos and can run to tens of megabytes. Worth grabbing one before any update to the page.</p></section>';
  return out;
}

function viewLightbox() {
  if (!S.lightbox) return "";
  var p = photoList().filter(function (x) { return x.id === S.lightbox; })[0];
  var src = S.photoData[S.lightbox];
  if (!p || !src) return "";
  var who = p.by && FAM[p.by] ? FAM[p.by].label : "";
  var d = fromIso(p.week);
  return '<div class="lightbox" id="lightbox"><button id="close-box" aria-label="Close">\u00d7</button>'
    + '<img src="' + src + '" alt="" />'
    + (p.caption ? '<p>' + esc(p.caption) + '</p>' : "")
    + '<p class="meta">' + esc(who) + ' \u00b7 ' + d.toLocaleDateString("en-US", { month: "long", day: "numeric", year: "numeric" }) + '</p></div>';
}

/* ---------- render ---------- */
function render() {
  document.getElementById("folio-no").textContent = (NS ? NS.toUpperCase() + " \u00b7 " : "") + "No. " + weekNumber(SAT);
  document.getElementById("folio-date").textContent = DATELINE;
  var app = document.getElementById("app"), nav = document.getElementById("nav");
  var resume = document.getElementById("resume-bar"), notice = document.getElementById("notice");
  var overlay = document.getElementById("overlay");

  if (!S.db) {
    nav.innerHTML = ""; resume.innerHTML = ""; notice.innerHTML = "";
    app.innerHTML = viewSetup(); overlay.innerHTML = "";
    return;
  }
  nav.innerHTML = viewNav();
  resume.innerHTML = (S.resumed && S.me)
    ? '<div class="resume"><p>Picking up where <b>' + esc(FAM[S.me].label) + '</b> left off.</p>'
      + '<button id="not-us">Not your family?</button><button class="dismiss" id="dismiss-resume" aria-label="Dismiss">\u00d7</button></div>' : "";
  var nsBar = NS ? '<div class="proof"><p><b>Sandbox.</b> You\u2019re on the \u201c' + esc(NS) + '\u201d copy. Votes, photos and log entries here are kept completely separate from the real board.</p></div>' : "";
  notice.innerHTML = nsBar + (S.status === "error"
    ? '<div class="proof"><p><b>Offline.</b> Your taps are saved on this device and will sync when the connection comes back.</p></div>' : "");

  var body = "";
  if (S.recap) {
    body = viewRecapForm();
  } else if (S.view === "poll") {
    body += viewRecapBar() + viewLede();
    if (!S.me) body += viewPicker();
    else body += '<div class="cols"><div class="col main">' + viewBallot() + '</div><aside class="col side">'
      + viewSpot() + viewStandings() + viewShare() + '</aside></div>';
  } else if (S.view === "feed") {
    body = viewFeed();
  } else if (S.view === "calendar") {
    body = viewCalendar();
  } else if (S.view === "places") {
    body = viewPlaces();
  }
  var keepY = window.scrollY || 0;
  app.innerHTML = body;
  overlay.innerHTML = viewLightbox();
  if (S.keepScroll !== false && keepY) window.scrollTo(0, keepY);
  if (S.scrollToFind) {
    S.scrollToFind = false;
    var card = document.querySelector(".find");
    if (card && card.scrollIntoView) card.scrollIntoView({ block: "center", behavior: "smooth" });
  }

  var input = document.getElementById("new-name");
  if (input && pendingName) input.value = pendingName;

  // pull in any photos now on screen
  if (S.view === "feed") {
    photoList().slice(0, S.feedShown).forEach(function (p) { loadPhoto(p.id); });
  }
  if (S.view === "calendar" && S.dayDetail) {
    var e2 = entriesByDate()[S.dayDetail];
    if (e2) photoList().filter(function (p) { return p.week === e2.week; }).forEach(function (p) { loadPhoto(p.id); });
  }
}

/* ---------- events ---------- */
document.addEventListener("input", function (e) {
  if (e.target.id === "new-name") pendingName = e.target.value;
  if (e.target.id === "r-venue") { S.recapVenue = null; onVenueType(e.target.value); }
  if (e.target.id === "s-venue") { S.spotQuery = e.target.value; onVenueType(e.target.value); }
});
document.addEventListener("focusin", function (e) {
  if (e.target.id === "r-venue" || e.target.id === "s-venue") onVenueType(e.target.value);
});
document.getElementById("photo-input").addEventListener("change", function (e) {
  if (e.target.files && e.target.files.length) uploadPhotos(e.target.files);
  e.target.value = "";
});

document.addEventListener("click", function (e) {
  var t = e.target.closest ? e.target.closest("button, .shot") : null;
  if (!t) return;
  var d = t.dataset || {};

  if (t.id === "db-save") {
    var db = normalizeDb(document.getElementById("db-input").value);
    if (!db) { S.setupError = "That doesn\u2019t look like a database URL. It should end in firebaseio.com or firebasedatabase.app."; render(); return; }
    S.setupError = null; S.db = db; ls("bagel:db", db); render(); boot(); return;
  }
  if (t.id === "copy-link") {
    var el = document.getElementById("share-link"); el.select();
    try { navigator.clipboard.writeText(el.value); } catch (err) { document.execCommand("copy"); }
    t.textContent = "Copied"; return;
  }
  if (d.view) {
    S.view = d.view; S.recap = null;
    if (d.view === "feed") loadPhotoMeta();
    if (d.view === "calendar" || d.view === "places") { loadLog(); loadPhotoMeta(); }
    render(); return;
  }
  if (d.fam) { S.me = d.fam; S.resumed = false; ls("bagel:me", S.me); render(); return; }
  if (t.id === "switch" || t.id === "not-us") { S.me = null; S.resumed = false; ls("bagel:me", null); render(); return; }
  if (t.id === "dismiss-resume") { S.resumed = false; render(); return; }

  if (d.avail) {
    var parts = d.avail.split(":");
    apply(function () {
      var m = ensureMine(), arr = m.avail[parts[0]], i = arr.indexOf(parts[1]);
      if (i > -1) arr.splice(i, 1); else arr.push(parts[1]);
    });
    return;
  }
  if (d.pick) {
    var pid = d.pick;
    apply(function () { var m = ensureMine(), i = m.picks.indexOf(pid); if (i > -1) m.picks.splice(i, 1); else m.picks.push(pid); });
    return;
  }
  if (d.slot) { var j = S.newSlots.indexOf(d.slot); if (j > -1) S.newSlots.splice(j, 1); else S.newSlots.push(d.slot); render(); return; }
  if (t.id === "add-act") {
    var name = (pendingName || "").trim();
    if (!name || !S.newSlots.length) return;
    var nid = "a-" + Date.now().toString(36);
    var ordered = SLOTS.filter(function (x) { return S.newSlots.indexOf(x.id) > -1; }).map(function (x) { return x.id; });
    pendingActivities = true;
    apply(function () { S.data.activities.push({ id: nid, name: name, slots: ordered, by: S.me }); ensureMine().picks.push(nid); });
    pendingName = ""; S.newSlots = []; render(); return;
  }
  if (d.ask) { S.confirming = d.ask; render(); return; }
  if (d.drop) {
    var did = d.drop; pendingActivities = true; S.confirming = null;
    apply(function () {
      S.data.activities = S.data.activities.filter(function (a) { return a.id !== did; });
      Object.keys(S.data.votes).forEach(function (fid) {
        S.data.votes[fid].picks = S.data.votes[fid].picks.filter(function (x) { return x !== did; });
      });
    });
    return;
  }
  if (t.id === "add-standards") {
    pendingActivities = true;
    apply(function () {
      DEFAULT_ACTIVITIES.forEach(function (d) {
        var there = S.data.activities.some(function (a) { return a.id === d.id || a.name.toLowerCase() === d.name.toLowerCase(); });
        if (!there) S.data.activities.push({ id: d.id, name: d.name, slots: d.slots.slice(), by: null });
      });
    });
    return;
  }
  if (t.id === "sit-out") {
    apply(function () { var m = ensureMine(); m.out = true; m.avail = { sat: [], sun: [] }; m.picks = []; });
    return;
  }
  if (t.id === "back-in") { apply(function () { ensureMine().out = false; }); return; }
  if (t.id === "clear-mine") {
    if (S.confirming !== "mine") { S.confirming = "mine"; render(); return; }
    S.confirming = null; apply(function () { delete S.data.votes[S.me]; }); return;
  }
  if (t.id === "clear-all") {
    if (S.confirming !== "all") { S.confirming = "all"; render(); return; }
    S.confirming = null; wipeAll = true; apply(function () { S.data.votes = {}; }); return;
  }

  /* ---- recap ---- */
  if (d.recap) {
    S.recap = d.recap; S.recapDraft = null; S.recapVenue = null; S.dayDetail = null;
    var existing = (S.log && S.log[d.recap]) || null;
    S.recapWho = existing && existing.who ? existing.who.slice() : [];
    S.recapSource = null;
    if (!existing) {
      req("GET", "/weekends/" + d.recap).then(function (raw) {
        var wd = normalize(raw || {});
        S.recapSource = wd;
        // pre-tick whoever voted for the winner that week
        var saved = S.data; S.data = wd;
        var rows = tally(); S.data = saved;
        if (rows[0] && rows[0].best.who.length) S.recapWho = rows[0].best.who.slice();
        render();
      }).catch(render);
    }
    render(); return;
  }
  if (d.who) {
    captureRecap();
    var i2 = S.recapWho.indexOf(d.who);
    if (i2 > -1) S.recapWho.splice(i2, 1); else S.recapWho.push(d.who);
    render(); return;
  }
  if (d.sugg !== undefined) {
    var pick = (S.suggestions || [])[Number(d.sugg)];
    if (pick && document.getElementById("s-venue")) {
      setSpot(pick.name, pick.lat, pick.lon, false, pick.sub || null);
      S.spotQuery = ""; S.suggestions = [];
      render(); return;
    }
    if (pick) {
      captureRecap();
      S.recapDraft = S.recapDraft || {};
      S.recapDraft.venue = pick.name;
      S.recapVenue = { name: pick.name, lat: pick.lat || null, lon: pick.lon || null };
      if (pick.lat) ls("bagel:near", pick.lat + "," + pick.lon);
      S.suggestions = [];
      render();
    }
    return;
  }
  if (t.id === "r-cancel") { S.recap = null; S.recapDraft = null; S.recapVenue = null; S.confirming = null; render(); return; }
  if (t.id === "r-delete") {
    if (S.confirming !== "del") { captureRecap(); S.confirming = "del"; render(); return; }
    var delKey = S.recap;
    delete S.log[delKey];
    S.recap = null; S.recapDraft = null; S.confirming = null; S.dayDetail = null; setStatus("saving"); render();
    req("DELETE", "/log/" + delKey).then(function () { setStatus("ok"); }).catch(function () { setStatus("error"); });
    return;
  }
  if (d.month) { S.calMonth = d.month; S.dayDetail = null; render(); return; }
  if (d.day) { S.dayDetail = d.day; loadPhotoMeta(); render(); return; }
  if (d.log) {
    S.recap = d.log; S.recapDraft = null; S.recapVenue = null; S.dayDetail = null; S.recapWho = []; S.confirming = null;
    S.recapSource = null; render(); return;
  }
  if (t.id === "back-cal") { S.dayDetail = null; render(); return; }
  if (t.id === "skip-recap") { S.skipRecap = unloggedWeek(); render(); return; }
  if (t.id === "r-save") {
    var oldKey = S.recap;
    var wk = (document.getElementById("r-date") || {}).value || oldKey;
    var sel = document.getElementById("r-act").value;
    var other = (document.getElementById("r-act-other").value || "").trim();
    var venueText = (document.getElementById("r-venue").value || "").trim();
    var entry = {
      activityName: sel === "__other" ? (other || "Got together") : sel,
      venue: venueText,
      day: fromIso(wk).getDay() === 0 ? "sun" : "sat",
      who: S.recapWho.slice(),
      by: S.me, ts: Date.now()
    };
    if (S.recapVenue && S.recapVenue.name === venueText && S.recapVenue.lat) {
      entry.lat = S.recapVenue.lat; entry.lon = S.recapVenue.lon;
    } else {
      var known = venueStats()[venueText.toLowerCase()];
      if (known && known.lat) { entry.lat = known.lat; entry.lon = known.lon; }
    }
    S.log = S.log || {};
    if (oldKey !== wk) delete S.log[oldKey];
    S.log[wk] = entry;
    S.recap = null; S.recapDraft = null; S.recapVenue = null; S.confirming = null;
    S.dayDetail = wk; S.calMonth = iso(new Date(fromIso(wk).getFullYear(), fromIso(wk).getMonth(), 1));
    S.view = "calendar"; setStatus("saving"); render();
    var jobs = [req("PUT", "/log/" + wk, entry)];
    if (oldKey !== wk) jobs.push(req("DELETE", "/log/" + oldKey));
    Promise.all(jobs).then(function () { setStatus("ok"); }).catch(function () { setStatus("error"); });
    return;
  }

  /* ---- feed ---- */
  if (d.year) { S.statYear = d.year; render(); return; }
  if (d.spotact) { S.spotAct = d.spotact; S.discovered = null; render(); return; }
  if (d.spot) { setSpot(d.spot, d.lat ? Number(d.lat) : null, d.lon ? Number(d.lon) : null, false, d.sub || null); S.discovered = null; render(); return; }
  if (t.id === "clear-spot") { clearSpot(); render(); return; }
  if (t.id === "offer-host") {
    var cur = (S.data.spots || {})[S.me];
    var leadId = leadActivityId();
    if (cur && cur.host && cur.act === leadId) clearSpot();
    else setSpot(FAM[S.me].label + "\u2019s place", null, null, true, null);
    render(); return;
  }
  if (d.find) {
    if (S.discovering) return;
    var rowsN = tally();
    var actN = rowsN[0] ? rowsN[0].activity.name : "";
    S.discovering = true; S.discoverMsg = null; render();
    fetchNewSpots(actN).then(function (list) {
      if (list === null) { S.discovered = null; S.discoverMsg = "Couldn\u2019t reach the map service just now \u2014 try again in a moment, or search by name above."; }
      else if (!list.length) { S.discovered = null; S.discoverMsg = "Nothing new nearby for this one \u2014 you\u2019ve been to most of them already."; }
      else { S.discovered = pickNew(list); S.discoverMsg = null; }
    }).catch(function () {
      S.discovered = null; S.discoverMsg = "Something went wrong looking that up \u2014 try again.";
    }).then(function () {
      S.discovering = false;
      S.scrollToFind = !!S.discovered;     // bring the result into view
      render();
    });
    return;
  }
  if (t.id === "roulette") {
    var rows0 = tally();
    var actName = rows0[0] ? rows0[0].activity.name : null;
    var pool = spotsForActivity(actName);
    var hit = pool.length ? rouletteFrom(pool) : null;
    if (hit) { setSpot(hit.name, hit.lat, hit.lon, false, hit.sub || null); }
    S.discovered = null;
    S.discoverMsg = hit ? null
      : "You haven\u2019t logged anywhere for " + (actName || "this").toLowerCase() + " yet \u2014 try \u201cSomewhere new\u201d.";
    render(); return;
  }
  if (t.id === "backup") { exportBackup(false); return; }
  if (t.id === "backup-full") { exportBackup(true); return; }
  if (t.id === "pick-photos") {
    var sel = document.getElementById("photo-week");
    if (sel) S.photoWeek = sel.value;
    document.getElementById("photo-input").click(); return;
  }
  if (t.id === "more-shots") { S.feedShown += 9; render(); return; }
  if (d.open) { S.lightbox = d.open; render(); return; }
  if (t.id === "close-box") { S.lightbox = null; render(); return; }
});

/* ---------- start ---------- */
drawOrnament();
S.db = readDbFromUrl() || normalizeDb(ls("bagel:db"));
if (S.db) ls("bagel:db", S.db);
var savedMe = ls("bagel:me");
if (savedMe && FAM[savedMe]) { S.me = savedMe; S.resumed = true; }
render();
if (S.db) boot(); else setStatus("setup");
</script>
</body>
</html>
